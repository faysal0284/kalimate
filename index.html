<style>
:root{--bg:#0d0f14;--card:rgba(255,255,255,0.035);--border:rgba(200,169,110,0.12);--gold:#c8a96e;--cream:#f0e6d3;--muted:rgba(240,230,211,0.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--cream)}
#app{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;position:relative}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fadeUp{animation:fadeUp .4s ease both}
.cardFlipped .cardInner{transform:rotateY(180deg)}
.cardInner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.cardFace{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;border-radius:20px;background:linear-gradient(145deg,rgba(200,169,110,0.06),rgba(13,15,20,0.95));border:1px solid var(--border)}
.cardBack{transform:rotateY(180deg)}
button{font-family:'DM Sans',sans-serif}
button:disabled{opacity:.45;cursor:default!important}
input:focus{outline:none;border-color:var(--gold)!important}
@media(hover:hover){button:hover:not(:disabled){filter:brightness(1.12)}}
/* Safe area — iPhone notch/Dynamic Island */
.wrap{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
/* Scrollbar */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(200,169,110,0.15);border-radius:2px}
/* ── Desktop ─────────────────────────────────────────── */
@media(min-width:768px){
  #app{align-items:flex-start;padding:20px;justify-content:center}
  .desk-root{display:grid;grid-template-columns:252px 1fr;gap:16px;width:100%;max-width:1060px;align-items:flex-start}
  .desk-nav{position:sticky;top:20px;height:calc(100dvh - 40px);overflow-y:auto;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,0.018);padding:12px;display:flex;flex-direction:column;gap:4px}
  .desk-nav::-webkit-scrollbar{width:3px}
  .wrap{max-width:none;padding-top:12px;padding-bottom:24px;padding-left:0;padding-right:0}
}
</style>

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\s]/g,"").trim();
const checkAns=(correct,given)=>{const c=norm(correct),g=norm(given),m=c.split("/")[0].trim();return g&&(c.includes(g)||g.includes(m));};

function initCartes(w){setState({cCards:shuf(w),cIdx:0,cFlip:false,cKnown:0,cLearn:0,cDone:false,screen:"cartes"});}
function initLearn(w){
  const s=shuf(w),r=genLQ(s[0],w,0);
  setState({lQ:s,lIdx:0,lOk:0,lWrong:[],lRound:1,lTotal:s.length,lAns:false,lPicked:null,lInput:"",
    lType:r.type,lChoices:r.choices||[],lTf:r.stmt||null,screen:"apprendre"});
}
function genLQ(word,words,diff){
  if(diff<0.4){const o=shuf(words.filter(x=>x.ar!==word.ar)).slice(0,3);return{type:"mcq",choices:shuf([...o,word])};}
  if(diff<0.7){const t=Math.random()>0.5,f=shuf(words.filter(x=>x.ar!==word.ar))[0];return{type:"tf",stmt:t?word:{...word,[aK()]:f[aK()]},isTrue:t};}
  return{type:"write"};
}
function initTest(w){
  const s=shuf(w),qs=s.map((word,i)=>{
    const p=i/s.length;
    if(p<0.4){const o=shuf(w.filter(x=>x.ar!==word.ar)).slice(0,3);return{id:i,type:"mcq",word,choices:shuf([...o,word])};}
    if(p<0.7){const t=Math.random()>0.5,f=shuf(w.filter(x=>x.ar!==word.ar))[0];return{id:i,type:"tf",word,stmt:t?word:{...word,[aK()]:f[aK()]},isTrue:t};}
    return{id:i,type:"write",word};
  });
  setState({tQs:qs,tAns:{},tSub:false,tScore:0,screen:"test"});
}
function initMatch(w){
  clearInterval(mTimer);
  const sub=shuf(w).slice(0,Math.min(w.length,6)),items=[];
  sub.forEach((word,i)=>{items.push({id:"q"+i,text:word[qK()],pid:i,side:"q"});items.push({id:"a"+i,text:word[aK()],pid:i,side:"a"});});
  setState({mPairs:shuf(items),mSel:null,mMatched:new Set(),mWrong:null,mTime:0,mRun:true,mDone:false,screen:"match"});
  mTimer=setInterval(()=>{state.mTime+=0.1;render();},100);
}
function initWrite(w){setState({wQ:shuf(w),wIdx:0,wIn:"",wAns:false,wOk:false,wScore:0,wWrong:[],wRound:1,wDone:false,screen:"ecrire"});}
function openMode(mode,lotId){
  state.lot=lotId;const w=lotId?LOTS.find(l=>l.id===lotId).words:ALL;
  ({cartes:initCartes,apprendre:initLearn,test:initTest,match:initMatch,ecrire:initWrite})[mode](w);
}
function goHome(){clearInterval(mTimer);setState({screen:"home"});}

function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")el.className=v;
    else if(k==="disabled"){if(v)el.setAttribute("disabled","");}
    else if(k==="placeholder")el.setAttribute("placeholder",v);
    else if(k==="value")el.value=v;
    else if(k==="autoFocus")setTimeout(()=>el.focus(),50);
    else el.setAttribute(k,v);
  });
  children.flat(9).forEach(c=>{if(c!=null)el.append(typeof c==="object"?c:document.createTextNode(String(c)));});
  return el;
}

      const isOk=c.ar===word.ar,isP=s.lPicked?.ar===c.ar;
      let bg="var(--card)",bd="var(--border)",cl="var(--cream)";
      if(s.lAns){if(isOk){bg="rgba(74,222,128,0.1)";bd="#4ade80";cl="#4ade80";}else if(isP){bg="rgba(239,68,68,0.1)";bd="#ef4444";cl="#ef4444";}}
      cDiv.append(h("button",{style:{width:"100%",padding:"14px 16px",border:"1px solid "+bd,borderRadius:"14px",background:bg,fontSize:"15px",fontWeight:"500",textAlign:"center",cursor:s.lAns?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s",color:cl,...arChoiceSt()},disabled:s.lAns,onClick:()=>{if(!s.lAns){s.lPicked=c;s.lAns=true;if(isOk)s.lOk++;else s.lWrong.push(word);render();}}},c[aK()]+(s.lAns&&isOk?" ✓":"")+(s.lAns&&isP&&!isOk?" ✗":"")));
    });
    d.append(cDiv);
  }

  if(s.lType==="tf"&&!s.lAns){
    d.append(h("div",{style:{display:"flex",gap:"10px"}},
      greenBtn("Vrai",()=>{s.lPicked=true;s.lAns=true;const ok=s.lTf?.ar===word.ar;if(ok)s.lOk++;else s.lWrong.push(word);render();}),
      orangeBtn("Faux",()=>{s.lPicked=false;s.lAns=true;const ok=s.lTf?.ar!==word.ar;if(ok)s.lOk++;else s.lWrong.push(word);render();})
    ));
  }
  if(s.lType==="tf"&&s.lAns){
    d.append(h("div",{style:{textAlign:"center",padding:"12px",borderRadius:"12px",background:"rgba(200,169,110,0.06)",border:"1px solid var(--border)"}},"Réponse : ",h("strong",{style:{color:"var(--gold)"}},word[aK()])));
  }

  if(s.lType==="write"){
    const inp=h("input",{style:{width:"100%",padding:"13px 16px",border:"1px solid var(--border)",borderRadius:"14px",background:"rgba(255,255,255,0.03)",color:"var(--cream)",fontSize:"16px",...arInputSt()},placeholder:s.dir==="ar-fr"?"Écris la traduction…":"اكتب الترجمة…",disabled:s.lAns,value:s.lInput,autoFocus:true});
    inp.addEventListener("input",e=>{s.lInput=e.target.value;});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!s.lAns&&s.lInput.trim()){s.lAns=true;if(checkAns(word[aK()],s.lInput))s.lOk++;else s.lWrong.push(word);render();}});
    d.append(inp);
    if(!s.lAns){d.append(goldBtn("Valider",()=>{if(!s.lInput.trim())return;s.lAns=true;if(checkAns(word[aK()],s.lInput))s.lOk++;else s.lWrong.push(word);render();}));}
    if(s.lAns){d.append(h("div",{style:{marginTop:"8px",padding:"12px",borderRadius:"14px",background:"rgba(200,169,110,0.06)",border:"1px solid var(--border)"}},h("div",{style:{fontSize:"12px",color:"var(--muted)"}},"Réponse :"),h("div",{style:{...aSt(),fontSize:s.dir!=="ar-fr"?"26px":"16px",marginTop:"4px"}},word[aK()])));}
  }

  if(s.lAns){
    d.append(goldBtn("Suivant →",()=>{
      const w=pool();
      if(s.lIdx+1<s.lQ.length){s.lIdx++;const r=genLQ(s.lQ[s.lIdx],w,Math.min((s.lRound-1)*0.35,0.85));Object.assign(s,{lType:r.type,lChoices:r.choices||[],lTf:r.stmt||null,lAns:false,lPicked:null,lInput:""});}
      else if(s.lWrong.length>0){const nq=shuf(s.lWrong);s.lQ=nq;s.lIdx=0;s.lWrong=[];s.lRound++;const r=genLQ(nq[0],w,Math.min((s.lRound-1)*0.35,0.85));Object.assign(s,{lType:r.type,lChoices:r.choices||[],lTf:r.stmt||null,lAns:false,lPicked:null,lInput:""});}
      else{setState({screen:"results"});}
      render();
    }));
  }
  return d;
}

// ═══════════════════════════════════════
//  TEST
// ═══════════════════════════════════════
function renderTest(){
  const s=state,d=h("div",{className:"fadeUp",style:{display:"flex",flexDirection:"column",gap:"14px"}});
  d.append(topBar("Test"+(s.lot?" · Lot "+s.lot:""),s.tQs.length+" questions",s.tSub?1:Object.keys(s.tAns).length/s.tQs.length));

  if(s.tSub){
    d.append(h("div",{className:"fadeUp",style:{textAlign:"center",padding:"16px",background:"var(--card)",borderRadius:"16px",border:"1px solid var(--border)"}},
      h("div",{style:{fontSize:"42px",marginBottom:"4px"}},s.tScore>=s.tQs.length*0.8?"🌟":s.tScore>=s.tQs.length*0.5?"👏":"💪"),
      h("div",{style:{fontSize:"28px",fontWeight:"700",color:"var(--cream)"}},s.tScore+"/"+s.tQs.length),
      h("div",{style:{color:"var(--muted)",fontSize:"14px"}},Math.round(s.tScore/s.tQs.length*100)+"%")
    ));
  }

  s.tQs.forEach((tq,i)=>{
    const isOk=s.tSub&&((tq.type==="mcq"&&s.tAns[tq.id]===tq.word.ar)||(tq.type==="tf"&&s.tAns[tq.id]===tq.isTrue)||(tq.type==="write"&&checkAns(tq.word[aK()],s.tAns[tq.id]||"")));
    const qDiv=h("div",{style:{padding:"16px 14px",borderRadius:"16px",background:s.tSub?(isOk?"rgba(74,222,128,0.04)":"rgba(239,68,68,0.04)"):"var(--card)",border:"1px solid "+(s.tSub?(isOk?"#4ade80":"#ef4444"):"var(--border)"),transition:"all .3s"}});
    qDiv.append(h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"6px"}},
      h("span",{style:{fontSize:"11px",color:"var(--gold)",letterSpacing:"1px"}},(tq.type==="mcq"?"QCM":tq.type==="tf"?"VRAI/FAUX":"ÉCRIT")+" · Q"+(i+1)),
      s.tSub?h("span",{style:{fontSize:"14px",color:isOk?"#4ade80":"#ef4444"}},isOk?"✓":"✗"):""
    ));
    qDiv.append(h("div",{style:{...qSt(),fontSize:s.dir==="ar-fr"?"30px":"16px",marginBottom:"10px"}},tq.word[qK()]));

    if(tq.type==="mcq"){
      const cc=h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
      tq.choices.forEach(c=>{
        const sel=s.tAns[tq.id]===c.ar,cor=c.ar===tq.word.ar;
        let st={width:"100%",padding:"10px 12px",border:"1px solid var(--border)",borderRadius:"10px",background:"var(--card)",fontSize:"14px",textAlign:"center",cursor:s.tSub?"default":"pointer",color:"var(--cream)",transition:"all .2s",...arChoiceSt()};
        if(s.tSub&&cor)Object.assign(st,{borderColor:"#4ade80",color:"#4ade80"});
        else if(s.tSub&&sel&&!cor)Object.assign(st,{borderColor:"#ef4444",color:"#ef4444"});
        else if(sel)Object.assign(st,{borderColor:"var(--gold)",background:"rgba(200,169,110,0.08)"});
        cc.append(h("button",{style:st,disabled:s.tSub,onClick:()=>{s.tAns[tq.id]=c.ar;render();}},c[aK()]));
      });
      qDiv.append(cc);
    }
    if(tq.type==="tf"){
      qDiv.append(h("div",{style:{textAlign:"center",marginBottom:"8px",fontSize:"15px",color:"var(--gold)"}},"= "+tq.stmt[aK()]+" ?"));
      const r=h("div",{style:{display:"flex",gap:"8px"}});
      [true,false].forEach(v=>{
        const sel=s.tAns[tq.id]===v;
        let st={flex:"1",padding:"10px 12px",border:"1px solid var(--border)",borderRadius:"10px",background:"var(--card)",fontSize:"14px",textAlign:"center",cursor:s.tSub?"default":"pointer",color:"var(--cream)",transition:"all .2s"};
        if(s.tSub&&v===tq.isTrue)Object.assign(st,{borderColor:"#4ade80",color:"#4ade80"});
        else if(s.tSub&&sel&&v!==tq.isTrue)Object.assign(st,{borderColor:"#ef4444",color:"#ef4444"});
        else if(sel)Object.assign(st,{borderColor:"var(--gold)",background:"rgba(200,169,110,0.08)"});
        r.append(h("button",{style:st,disabled:s.tSub,onClick:()=>{s.tAns[tq.id]=v;render();}},v?"Vrai":"Faux"));
      });
      qDiv.append(r);
    }
    if(tq.type==="write"){
      const inp=h("input",{style:{width:"100%",padding:"13px 16px",border:"1px solid var(--border)",borderRadius:"14px",background:"rgba(255,255,255,0.03)",color:"var(--cream)",fontSize:"14px",...arInputSt()},placeholder:"Ta réponse…",disabled:s.tSub,value:s.tAns[tq.id]||""});
      inp.addEventListener("input",e=>{s.tAns[tq.id]=e.target.value;});
      qDiv.append(inp);
      if(s.tSub&&!isOk)qDiv.append(h("div",{style:{fontSize:"13px",color:"#4ade80",marginTop:"4px"}},"Réponse : "+tq.word[aK()]));
    }
    d.append(qDiv);
  });

  if(!s.tSub){
    d.append(goldBtn("Soumettre ("+Object.keys(s.tAns).length+"/"+s.tQs.length+")",()=>{
      let sc=0;
      s.tQs.forEach(tq=>{const a=s.tAns[tq.id];if(tq.type==="mcq"&&a===tq.word.ar)sc++;else if(tq.type==="tf"&&a===tq.isTrue)sc++;else if(tq.type==="write"&&checkAns(tq.word[aK()],a||""))sc++;});
      setState({tScore:sc,tSub:true});window.scrollTo(0,0);
    },{position:"sticky",bottom:"12px",zIndex:"10"}));
  } else {
    d.append(h("div",{style:{display:"flex",gap:"10px"}},goldBtn("Refaire",()=>initTest(pool()),{flex:"1"}),dimBtn("Accueil",goHome,{flex:"1"})));
  }
  return d;
}

// ═══════════════════════════════════════
//  MATCH
// ═══════════════════════════════════════
function renderMatch(){
  const s=state,d=h("div",{className:"fadeUp",style:{display:"flex",flexDirection:"column",gap:"14px",alignItems:"center"}});
  d.append(topBar("Associer",s.mDone?"Terminé":"Trouve les paires",s.mMatched.size/(s.mPairs.length/2)));
  d.append(h("div",{style:{fontSize:"30px",fontWeight:"700",color:"var(--cream)",fontVariantNumeric:"tabular-nums"}},s.mTime.toFixed(1)+"s"));

  if(!s.mDone){
    const grid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",width:"100%"}});
    s.mPairs.forEach(item=>{
      const mt=s.mMatched.has(item.pid),sel=s.mSel?.id===item.id,wr=s.mWrong?.includes(item.id);
      const isAr=(s.dir==="ar-fr"&&item.side==="q")||(s.dir!=="ar-fr"&&item.side==="a");
      grid.append(h("button",{style:{padding:"14px 8px",borderRadius:"14px",border:"1px solid "+(wr?"#ef4444":sel?"var(--gold)":"var(--border)"),background:wr?"rgba(239,68,68,0.1)":sel?"rgba(200,169,110,0.1)":"var(--card)",color:"var(--cream)",fontWeight:"500",cursor:mt?"default":"pointer",textAlign:"center",transition:"all .25s ease",minHeight:"52px",display:"flex",alignItems:"center",justifyContent:"center",opacity:mt?"0.15":"1",transform:mt?"scale(0.9)":"scale(1)",...(isAr?{fontFamily:"'Amiri',serif",fontSize:"22px",direction:"rtl"}:{fontSize:"13px"})},disabled:mt,onClick:()=>{
        if(mt||s.mDone||s.mWrong)return;
        if(!s.mSel){s.mSel=item;render();return;}
        if(s.mSel.id===item.id){s.mSel=null;render();return;}
        if(s.mSel.side===item.side){s.mSel=item;render();return;}
        if(s.mSel.pid===item.pid){s.mMatched.add(item.pid);s.mSel=null;if(s.mMatched.size===s.mPairs.length/2){clearInterval(mTimer);s.mRun=false;s.mDone=true;}}
        else{s.mWrong=[s.mSel.id,item.id];setTimeout(()=>{s.mWrong=null;s.mSel=null;render();},500);}
        render();
      }},item.text));
    });
    d.append(grid);
  } else {
    d.append(doneScreen("🎯",s.mTime<15?"Excellent !":s.mTime<25?"Bien joué !":"Continue !","Temps : "+s.mTime.toFixed(1)+"s",()=>initMatch(pool())));
  }
  return d;
}

// ═══════════════════════════════════════
//  ÉCRIRE
// ═══════════════════════════════════════
function renderWrite(){
  const s=state,d=h("div",{className:"fadeUp",style:{display:"flex",flexDirection:"column",gap:"14px"}});
  d.append(topBar("Écrire"+(s.lot?" · Lot "+s.lot:""),s.wDone?"Terminé":"Tour "+s.wRound+" · "+(s.wIdx+1)+"/"+s.wQ.length,(s.wIdx+(s.wAns?1:0))/s.wQ.length));

  if(!s.wDone){
    const word=s.wQ[s.wIdx];
    d.append(h("div",{style:{padding:"22px 18px",borderRadius:"16px",background:"var(--card)",border:"1px solid var(--border)",textAlign:"center"}},h("div",{style:qSt()},word[qK()])));

    const inp=h("input",{style:{width:"100%",padding:"13px 16px",border:"1px solid var(--border)",borderRadius:"14px",background:"rgba(255,255,255,0.03)",color:"var(--cream)",fontSize:"16px",...arInputSt()},placeholder:s.dir==="ar-fr"?"Écris en français…":"اكتب بالعربية…",disabled:s.wAns,value:s.wIn,autoFocus:true});
    inp.addEventListener("input",e=>{s.wIn=e.target.value;});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!s.wAns&&s.wIn.trim()){s.wOk=checkAns(word[aK()],s.wIn);s.wAns=true;if(s.wOk)s.wScore++;else s.wWrong.push(word);render();}});
    d.append(inp);

    if(!s.wAns){
      d.append(h("div",{style:{display:"flex",gap:"10px"}},
        goldBtn("Valider",()=>{if(!s.wIn.trim())return;s.wOk=checkAns(word[aK()],s.wIn);s.wAns=true;if(s.wOk)s.wScore++;else s.wWrong.push(word);render();},{flex:"1"}),
        dimBtn("Passer",()=>{s.wAns=true;s.wOk=false;s.wWrong.push(word);render();})
      ));
    } else {
      d.append(h("div",{className:"fadeUp"},
        h("div",{style:{padding:"14px",borderRadius:"14px",marginBottom:"10px",background:s.wOk?"rgba(74,222,128,0.06)":"rgba(239,68,68,0.06)",border:"1px solid "+(s.wOk?"rgba(74,222,128,0.3)":"rgba(239,68,68,0.3)")}},
          h("div",{style:{fontSize:"13px",fontWeight:"600",color:s.wOk?"#4ade80":"#ef4444",marginBottom:"4px"}},s.wOk?"Correct !":"Incorrect"),
          h("div",{style:{...aSt(),fontSize:s.dir!=="ar-fr"?"26px":"16px"}},word[aK()])
        ),
        goldBtn(s.wIdx+1<s.wQ.length?"Suivant →":s.wWrong.length>0&&s.wRound<3?"Tour suivant (ratés)":"Terminer",()=>{
          if(s.wIdx+1<s.wQ.length){s.wIdx++;s.wIn="";s.wAns=false;}
          else if(s.wWrong.length>0&&s.wRound<3){s.wQ=shuf(s.wWrong);s.wIdx=0;s.wWrong=[];s.wRound++;s.wIn="";s.wAns=false;}
          else s.wDone=true;
          render();
        },{width:"100%"})
      ));
    }
  } else {
    d.append(doneScreen(s.wScore>=s.wQ.length*0.8?"🌟":"💪",s.wScore+" correct"+(s.wScore>1?"s":""),"en "+s.wRound+" tour"+(s.wRound>1?"s":""),()=>initWrite(pool())));
  }
  return d;
}

// ═══════════════════════════════════════
//  RESULTS
// ═══════════════════════════════════════
function renderResults(){
  return doneScreen("🌟","Apprendre",state.lOk+"/"+state.lTotal+" — "+state.lRound+" tour"+(state.lRound>1?"s":""),()=>initLearn(pool()));
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
loadProgress();
render();
window.addEventListener("resize",render);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
